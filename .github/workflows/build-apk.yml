name: Build Nuvio APK

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create local properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
        run: |
          if [ -z "$NUVIO_SUPABASE_URL" ] || [ -z "$NUVIO_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing NUVIO_SUPABASE_URL or NUVIO_SUPABASE_ANON_KEY repository secret. Refusing to build an APK with broken account/QR configuration."
            exit 1
          fi
          {
            echo "TMDB_API_KEY=$TMDB_API_KEY"
            echo "NUVIO_SUPABASE_URL=$NUVIO_SUPABASE_URL"
            echo "NUVIO_SUPABASE_ANON_KEY=$NUVIO_SUPABASE_ANON_KEY"
            echo "NUVIO_SUPABASE_FALLBACK_URL=$NUVIO_SUPABASE_FALLBACK_URL"
          } > local.properties
          {
            echo "NUVIO_SUPABASE_URL=$NUVIO_SUPABASE_URL"
            echo "NUVIO_SUPABASE_ANON_KEY=$NUVIO_SUPABASE_ANON_KEY"
            echo "NUVIO_SUPABASE_FALLBACK_URL=$NUVIO_SUPABASE_FALLBACK_URL"
          } > local.dev.properties

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleFullDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Cinemana-APK
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
